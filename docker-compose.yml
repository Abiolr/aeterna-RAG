services:
  aeterna-api:
    image: abiolar/aeterna-rag-api:latest
    container_name: aeterna-rag-api
    restart: unless-stopped

    expose:
      - "3000"

    env_file:
      - .env

    # NEW: turns on multiprocess metrics (see services/metrics.py).
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc

    # NEW: an in-memory folder where the 2 workers keep their counters.
    # It is wiped every time the container starts, which is what we want
    # (no stale numbers from a previous run).
    tmpfs:
      - /tmp/prometheus_multiproc:mode=1777

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    env_file:
      - .env

    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NEW: collects and stores the numbers.
  prometheus:
    image: prom/prometheus:latest      # pin a specific version once it works
    container_name: aeterna-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # keep 15 days (EC2 disk is limited)
    ports:
      - "127.0.0.1:9090:9090"   # 127.0.0.1 = reachable only from the server itself
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - aeterna-api

  # NEW: the dashboards.
  grafana:
    image: grafana/grafana:latest      # pin a specific version once it works
    container_name: aeterna-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"   # server-only; host port 3001 -> Grafana's 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    container_name: aeterna-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - aeterna-api

  certbot:
    image: certbot/certbot
    container_name: aeterna-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  redis-data:
  prometheus-data:   # NEW
  grafana-data:      # NEW