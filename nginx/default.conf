server {
    listen 80;
    server_name aeterna-api.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aeterna-api.duckdns.org;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/aeterna-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeterna-api.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://aeterna-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}